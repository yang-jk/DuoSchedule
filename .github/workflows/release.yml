name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore

      - name: Build release APK
        env:
          KEYSTORE_FILE: app/keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/')
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk \
             2>/dev/null || \
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: DuoSchedule ${{ steps.version.outputs.version_name }}
          body: |
            ## DuoSchedule ${{ steps.version.outputs.version_name }}

            版本号: ${{ steps.version.outputs.version_code }}

            ---
            更新内容请查看提交记录。
          files: |
            app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update update.json
        env:
          UPDATE_REPO_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          REPO_OWNER="yang-jk"
          REPO_NAME="duoschedule-update"
          DOWNLOAD_URL="https://github.com/${REPO_OWNER}/DuoSchedule/releases/download/${TAG_NAME}/DuoSchedule-${VERSION_NAME}.apk"

          cat > update.json <<EOF
          {
            "latestVersion": "${VERSION_NAME}",
            "latestVersionCode": ${VERSION_CODE},
            "minSupportedVersionCode": 1,
            "downloadUrl": "${DOWNLOAD_URL}",
            "releaseNotes": "DuoSchedule ${VERSION_NAME}",
            "forceUpdate": false
          }
          EOF

          git clone https://x-access-token:${UPDATE_REPO_TOKEN}@github.com/${REPO_OWNER}/${REPO_NAME}.git update-repo

          cp update.json update-repo/update.json

          cd update-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update to ${VERSION_NAME} (${VERSION_CODE})" || echo "No changes to commit"
          git push
