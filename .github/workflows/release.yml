name: 构建与发布 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 提取版本信息（用于通知）
        id: version_early
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts 2>/dev/null | head -1 | sed 's/.*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/' || echo "未知")
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: 构建开始通知
        env:
          SERVERCHAN_URL: ${{ secrets.SERVERCHAN_URL }}
          VERSION_NAME: ${{ steps.version_early.outputs.version_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SERVERCHAN_URL" ]; then exit 0; fi
          python3 -c "
          import json, os
          data = {
            'title': f'🚀 DuoSchedule v{os.environ[\"VERSION_NAME\"]} 开始构建',
            'desp': f'版本: {os.environ[\"VERSION_NAME\"]}  \n提交: {os.environ[\"COMMIT_MSG\"]}  \n\n构建详情: {os.environ[\"RUN_URL\"]}'
          }
          with open('notify_start.json', 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False)
          "
          curl -s -X POST "${SERVERCHAN_URL}" -H "Content-Type: application/json" -d @notify_start.json > /dev/null 2>&1 || true

      - name: 检出代码
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        id: setup_jdk
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle
        id: setup_gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 确保 Gradle Wrapper 可执行
        id: gradle_wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: 从变更记录生成更新日志数据
        id: generate_changelog
        run: python3 scripts/generate_changelog.py

      - name: 切换 Gradle 下载源为官方源
        id: switch_gradle_source
        run: sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|g' gradle/wrapper/gradle-wrapper.properties

      - name: 移除阿里云镜像配置
        id: remove_aliyun_mirror
        run: sed -i '/maven.*aliyun/d' settings.gradle.kts

      - name: 提取版本信息并校验 versionCode
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/')

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          CALCULATED_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "calculated_version_code=$CALCULATED_VERSION_CODE" >> $GITHUB_OUTPUT

          if [ "$VERSION_CODE" != "$CALCULATED_VERSION_CODE" ]; then
            echo "::error::versionCode 不匹配！build.gradle.kts 中为 $VERSION_CODE，但按公式 (MAJOR×10000 + MINOR×100 + PATCH) 计算版本名 $VERSION_NAME 应为 $CALCULATED_VERSION_CODE"
            exit 1
          fi
          echo "✅ versionCode 校验通过: $VERSION_CODE"

      - name: 提取变更记录
        id: changelog
        run: |
          CHANGELOG=""
          if [ -f Product-Spec-CHANGELOG.md ]; then
            # 获取上一个 Release 的版本号
            PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
            PREV_VERSION=""
            if [ -n "$PREV_TAG" ]; then
              PREV_VERSION=$(echo "$PREV_TAG" | sed 's/^v//')
            fi

            if [ -n "$PREV_VERSION" ]; then
              echo "上一个版本: $PREV_VERSION, 当前版本: ${{ steps.version.outputs.version_name }}"
              # 提取从上一个版本（不含）到当前版本（含）的所有变更
              CHANGELOG=$(awk -v prev="\\[${PREV_VERSION}\\]" -v curr="\\[${{ steps.version.outputs.version_name }}\\]" '
                /^## \[/ { 
                  if (match($0, prev)) { flag=0; next }
                  if (match($0, curr)) { flag=1; next }
                  if (flag && /^## \[/) { flag=0; next }
                }
                flag { print }
              ' Product-Spec-CHANGELOG.md | sed '/^---$/d;/^$/d')
            fi

            # 如果没有上一个版本或提取为空，只提取当前版本
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG=$(awk "/^## \\[${{ steps.version.outputs.version_name }}\\]/{flag=1;next}/^## \\[/{flag=0}flag" Product-Spec-CHANGELOG.md | sed '/^---$/d;/^$/d')
            fi
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="版本 ${{ steps.version.outputs.version_name }} 更新"
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 解码签名文件
        id: decode_keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore

      - name: 构建正式版 APK
        id: build
        env:
          KEYSTORE_FILE: keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew clean assembleRelease 2>&1 | tee build_output.log
        continue-on-error: true

      - name: 提取构建错误
        if: steps.build.outcome == 'failure'
        id: build_errors
        run: |
          ERRORS=$(grep -E '^(e: |w: |ERROR|FAILURE|> Task.*FAILED)' build_output.log | head -20 || true)
          if [ -z "$ERRORS" ]; then
            ERRORS=$(tail -30 build_output.log)
          fi
          {
            echo "errors<<EOF"
            echo "$ERRORS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 构建失败则终止
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: 重命名 APK 文件
        id: apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 未找到 APK 文件"
            ls -laR app/build/outputs/apk/release/ 2>/dev/null || echo "目录不存在"
            exit 1
          fi
          echo "找到 APK: $APK_PATH"
          mv "$APK_PATH" "app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk"

          APK_FILE="app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk"
          APK_BYTES=$(stat -c%s "$APK_FILE")
          APK_MB=$(echo "scale=1; $APK_BYTES / 1048576" | bc)
          echo "apk_size=${APK_MB} MB" >> $GITHUB_OUTPUT

          RELEASE_DATE=$(date +%Y-%m-%d)
          echo "release_date=${RELEASE_DATE}" >> $GITHUB_OUTPUT

      - name: 创建或更新 Git 标签
        id: create_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          SHA="${{ github.sha }}"
          gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --method DELETE 2>/dev/null || true
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA"

      - name: 发布到 GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: DuoSchedule ${{ steps.version.outputs.version_name }}
          body: |
            ## DuoSchedule ${{ steps.version.outputs.version_name }}

            版本号: ${{ steps.version.outputs.version_code }}

            ---

            ${{ steps.changelog.outputs.changelog }}
          files: |
            app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 Gitee Release
        id: gitee_release
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          set +e

          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 发布"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          APK_FILE="app/build/outputs/apk/release/DuoSchedule-${VERSION_NAME}.apk"
          TAG="v${VERSION_NAME}"
          GITEE_API="https://gitee.com/api/v5/repos/su-zijie21/duoschedule"

          echo "检查已存在的 Gitee Release..."
          EXISTING_RELEASE=$(curl -sf "${GITEE_API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" 2>/dev/null || echo "")
          EXISTING_ID=""
          if [ -n "$EXISTING_RELEASE" ]; then
            EXISTING_ID=$(echo "$EXISTING_RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          fi

          if [ -n "$EXISTING_ID" ]; then
            echo "删除已存在的 Gitee Release: $EXISTING_ID"
            curl -sf -X DELETE "${GITEE_API}/releases/${EXISTING_ID}?access_token=${GITEE_TOKEN}" > /dev/null 2>&1 || true
          fi

          echo "创建 Gitee Release..."
          JSON_BODY=$(python3 -c "
          import json, os
          data = {
            'tag_name': 'v' + os.environ['VERSION_NAME'],
            'name': 'DuoSchedule ' + os.environ['VERSION_NAME'],
            'body': '版本号: ' + os.environ['VERSION_CODE'] + '\n\n' + os.environ.get('CHANGELOG', ''),
            'target_commitish': 'main'
          }
          print(json.dumps(data, ensure_ascii=False))
          ")

          RESPONSE=$(curl -s -X POST "${GITEE_API}/releases?access_token=${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$JSON_BODY")

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              rid = data.get('id', '')
              if rid and isinstance(rid, int):
                  print(rid)
              else:
                  print('')
          except:
              print('')
          " 2>/dev/null)

          if [ -z "$RELEASE_ID" ]; then
            echo "Gitee Release 创建失败"
            echo "响应内容: $RESPONSE"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "gitee_error<<EOF" >> $GITHUB_OUTPUT
            echo "Release创建失败: $RESPONSE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Gitee Release 已创建: $RELEASE_ID"

          echo "验证 Release 是否存在..."
          VERIFY_RESPONSE=$(curl -sf "${GITEE_API}/releases/${RELEASE_ID}?access_token=${GITEE_TOKEN}" 2>/dev/null || echo "")
          if [ -z "$VERIFY_RESPONSE" ]; then
            echo "⚠️ Release $RELEASE_ID 验证失败，可能不存在"
          else
            echo "✅ Release $RELEASE_ID 验证成功"
          fi

          echo "上传 APK 到 Gitee Release (最多重试3次)..."
          UPLOAD_SUCCESS=false
          for i in 1 2 3; do
            echo "第 $i 次尝试上传..."
            UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${GITEE_API}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" \
              -F "file=@${APK_FILE}")
            UPLOAD_HTTP_CODE=$(echo "$UPLOAD_RESPONSE" | tail -1)
            UPLOAD_BODY=$(echo "$UPLOAD_RESPONSE" | sed '$d')

            if [ "$UPLOAD_HTTP_CODE" = "201" ]; then
              echo "✅ APK 已上传到 Gitee Release"
              UPLOAD_SUCCESS=true
              break
            else
              echo "⚠️ 上传失败 (HTTP $UPLOAD_HTTP_CODE): $UPLOAD_BODY"
              if [ "$i" -lt 3 ]; then
                echo "等待 5 秒后重试..."
                sleep 5
              fi
            fi
          done

          if [ "$UPLOAD_SUCCESS" = "true" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ APK 上传到 Gitee 失败（已重试3次）"
            echo "gitee_error<<EOF" >> $GITHUB_OUTPUT
            echo "APK上传失败 (HTTP $UPLOAD_HTTP_CODE, 已重试3次): $UPLOAD_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: 更新 update.json
        id: update_repo
        continue-on-error: true
        env:
          UPDATE_REPO_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.changelog }}
          APK_SIZE: ${{ steps.apk_info.outputs.apk_size }}
          RELEASE_DATE: ${{ steps.apk_info.outputs.release_date }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: su-zijie21
          GITEE_RELEASE_SUCCESS: ${{ steps.gitee_release.outputs.success }}
        run: |
          python3 scripts/update_repo.py 2>&1 | tee update_repo_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" != "0" ]; then
            ERRORS=$(tail -20 update_repo_output.log)
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            echo "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          exit $EXIT_CODE

      - name: Server酱通知
        if: always()
        env:
          SERVERCHAN_URL: ${{ secrets.SERVERCHAN_URL }}
          VERSION_NAME: ${{ steps.version.outputs.version_name || steps.version_early.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code || '未知' }}
          APK_SIZE: ${{ steps.apk_info.outputs.apk_size }}
          RELEASE_DATE: ${{ steps.apk_info.outputs.release_date }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          GITEE_RELEASE_OUTCOME: ${{ steps.gitee_release.outcome }}
          GITEE_RELEASE_SUCCESS: ${{ steps.gitee_release.outputs.success }}
          BUILD_ERRORS: ${{ steps.build_errors.outputs.errors }}
          GITEE_ERROR: ${{ steps.gitee_release.outputs.gitee_error }}
          UPDATE_REPO_ERRORS: ${{ steps.update_repo.outputs.errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$SERVERCHAN_URL" ]; then
            echo "SERVERCHAN_URL 未配置，跳过通知"
            exit 0
          fi

          format_status() {
            local outcome="$1"
            case "$outcome" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              '') echo "⏭️" ;;
              *) echo "❓" ;;
            esac
          }

          # 找出失败的步骤
          FAILED_STEPS=""
          for item in "版本校验:${{ steps.version.outcome }}" "APK 构建:$BUILD_OUTCOME" "APK 重命名:${{ steps.apk_info.outcome }}" "创建标签:${{ steps.create_tag.outcome }}" "GitHub Release:$RELEASE_OUTCOME" "Gitee Release:$GITEE_RELEASE_OUTCOME" "更新仓库:${{ steps.update_repo.outcome }}"; do
            step_name="${item%%:*}"
            step_outcome="${item##*:}"
            if [ "$step_outcome" = "failure" ]; then
              if [ -n "$FAILED_STEPS" ]; then FAILED_STEPS="${FAILED_STEPS}, "; fi
              FAILED_STEPS="${FAILED_STEPS}${step_name}"
            fi
          done

          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ DuoSchedule v${VERSION_NAME} 发布成功"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            TITLE="🚫 DuoSchedule v${VERSION_NAME} 构建已取消"
          elif [ -n "$FAILED_STEPS" ]; then
            TITLE="❌ DuoSchedule v${VERSION_NAME} 构建失败（${FAILED_STEPS}）"
          else
            TITLE="❌ DuoSchedule v${VERSION_NAME} 构建失败"
          fi

          BUILD_STATUS=$(format_status "$BUILD_OUTCOME")
          RELEASE_STATUS=$(format_status "$RELEASE_OUTCOME")
          GITEE_RELEASE_STATUS=$(format_status "$GITEE_RELEASE_OUTCOME")
          UPDATE_REPO_STATUS=$(format_status "${{ steps.update_repo.outcome }}")

          export TITLE BUILD_STATUS RELEASE_STATUS GITEE_RELEASE_STATUS UPDATE_REPO_STATUS

          python3 -c "
          import json, os
          version_name = os.environ['VERSION_NAME']
          version_code = os.environ['VERSION_CODE']
          title = os.environ['TITLE']
          apk_size = os.environ.get('APK_SIZE', '')
          release_date = os.environ.get('RELEASE_DATE', '')
          changelog = os.environ.get('CHANGELOG', '')
          build_status = os.environ['BUILD_STATUS']
          release_status = os.environ['RELEASE_STATUS']
          gitee_release_status = os.environ['GITEE_RELEASE_STATUS']
          update_repo_status = os.environ['UPDATE_REPO_STATUS']
          gitee_release_success = os.environ.get('GITEE_RELEASE_SUCCESS', '')
          build_errors = os.environ.get('BUILD_ERRORS', '')
          gitee_error = os.environ.get('GITEE_ERROR', '')
          update_repo_errors = os.environ.get('UPDATE_REPO_ERRORS', '')
          run_url = os.environ['RUN_URL']

          desp = f'版本: {version_name} ({version_code})  '
          if apk_size:
              desp += f'  \n大小: {apk_size}  '
          if release_date:
              desp += f'  \n日期: {release_date}  '
          desp += f'  \n\nAPK 构建: {build_status}  \nGitHub Release: {release_status}  \nGitee Release: {gitee_release_status}  \n更新仓库: {update_repo_status}  '
          if gitee_release_success == 'false':
              desp += f'  \n⚠️ Gitee Release 失败，downloadUrl 已回退到 GitHub  '
          if changelog:
              desp += f'  \n\n---  \n**更新内容:**  \n{changelog}  '
          error_parts = []
          if build_errors:
              error_parts.append(f'**APK 构建错误:**  \n\`\`\`\n{build_errors}\n\`\`\`')
          if gitee_error:
              error_parts.append(f'**Gitee Release 错误:**  \n\`\`\`\n{gitee_error}\n\`\`\`')
          if update_repo_errors:
              error_parts.append(f'**更新仓库错误:**  \n\`\`\`\n{update_repo_errors}\n\`\`\`')
          if error_parts:
              desp += f'  \n\n---  \n' + '  \n'.join(error_parts) + '  '
          desp += f' \n\n构建详情: {run_url}'
          data = {
            'title': title,
            'desp': desp
          }
          with open('notify.json', 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False)
          "

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${SERVERCHAN_URL}" \
            -H "Content-Type: application/json" \
            -d @notify.json)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Server酱响应 (HTTP $HTTP_CODE): $BODY"
