name: Build & Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Extract version info and verify versionCode
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/')

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          CALCULATED_VERSION_CODE=$((MAJOR * 100000 + MINOR * 1000 + PATCH))

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "calculated_version_code=$CALCULATED_VERSION_CODE" >> $GITHUB_OUTPUT

          if [ "$VERSION_CODE" != "$CALCULATED_VERSION_CODE" ]; then
            echo "::error::versionCode mismatch! build.gradle.kts has $VERSION_CODE, but formula (MAJOR×100000 + MINOR×1000 + PATCH) calculates $CALCULATED_VERSION_CODE for versionName $VERSION_NAME"
            exit 1
          fi
          echo "✅ versionCode verification passed: $VERSION_CODE"

      - name: Extract changelog
        id: changelog
        run: |
          CHANGELOG=""
          if [ -f Product-Spec-CHANGELOG.md ]; then
            CHANGELOG=$(awk "/^## \\[${{ steps.version.outputs.version_name }}\\]/{flag=1;next}/^## \\[/{flag=0}flag" Product-Spec-CHANGELOG.md | sed '/^---$/d;/^### 状态/d;/^### 修改文件/d;/^- `.*$/d;/^$/d;s/^### 变更内容//;s/^### 变更类型//;s/\*\*//g;s/^## //')
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="版本 ${{ steps.version.outputs.version_name }} 更新"
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore

      - name: Build release APK
        id: build
        env:
          KEYSTORE_FILE: app/keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        if: success()
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk \
             2>/dev/null || \
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk

      - name: Create or update tag
        if: success()
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Create GitHub Release
        id: release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: DuoSchedule ${{ steps.version.outputs.version_name }}
          body: |
            ## DuoSchedule ${{ steps.version.outputs.version_name }}

            版本号: ${{ steps.version.outputs.version_code }}

            ---

            ${{ steps.changelog.outputs.changelog }}
          files: |
            app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update update.json via GitHub API
        id: update_repo
        if: success()
        continue-on-error: true
        env:
          UPDATE_REPO_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.changelog }}
        run: python3 scripts/update_repo.py

      - name: Notify via ServerChan
        if: always()
        env:
          SERVERCHAN_URL: ${{ secrets.SERVERCHAN_URL }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          UPDATE_REPO_OUTCOME: ${{ steps.update_repo.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SERVERCHAN_URL" ]; then
            echo "SERVERCHAN_URL not configured, skipping notification"
            exit 0
          fi

          format_status() {
            local outcome="$1"
            case "$outcome" in
              success) echo "✅ 成功" ;;
              failure) echo "❌ 失败" ;;
              skipped) echo "⏭️ 跳过" ;;
              *) echo "❓ $outcome" ;;
            esac
          }

          BUILD_STATUS=$(format_status "$BUILD_OUTCOME")
          RELEASE_STATUS=$(format_status "$RELEASE_OUTCOME")
          UPDATE_REPO_STATUS=$(format_status "$UPDATE_REPO_OUTCOME")
          export BUILD_STATUS
          export RELEASE_STATUS
          export UPDATE_REPO_STATUS

          if [ "$BUILD_OUTCOME" = "success" ] && [ "$RELEASE_OUTCOME" = "success" ] && [ "$UPDATE_REPO_OUTCOME" = "success" ]; then
            export TITLE="✅ DuoSchedule v${VERSION_NAME} 发布成功"
          else
            export TITLE="⚠️ DuoSchedule v${VERSION_NAME} 发布异常"
          fi

          python3 -c "
          import json, os
          version_name = os.environ['VERSION_NAME']
          version_code = os.environ['VERSION_CODE']
          build_status = os.environ['BUILD_STATUS']
          release_status = os.environ['RELEASE_STATUS']
          update_repo_status = os.environ['UPDATE_REPO_STATUS']
          run_url = os.environ['RUN_URL']
          title = os.environ['TITLE']
          desp = f'版本: {version_name} ({version_code})  \nAPK 构建: {build_status}  \nRelease 创建: {release_status}  \n更新仓库: {update_repo_status}  \n\n构建详情: {run_url}'
          data = {
            'title': title,
            'desp': desp
          }
          with open('notify.json', 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False)
          "

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${SERVERCHAN_URL}" \
            -H "Content-Type: application/json" \
            -d @notify.json)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "ServerChan response (HTTP $HTTP_CODE): $BODY"
