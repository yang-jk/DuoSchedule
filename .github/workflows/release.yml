name: 构建与发布 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 确保 Gradle Wrapper 可执行
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: 从变更记录生成更新日志数据
        run: python3 scripts/generate_changelog.py

      - name: 切换 Gradle 下载源为官方源
        run: sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|g' gradle/wrapper/gradle-wrapper.properties

      - name: 移除阿里云镜像配置
        run: sed -i '/maven.*aliyun/d' settings.gradle.kts

      - name: 提取版本信息并校验 versionCode
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/')

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          CALCULATED_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "calculated_version_code=$CALCULATED_VERSION_CODE" >> $GITHUB_OUTPUT

          if [ "$VERSION_CODE" != "$CALCULATED_VERSION_CODE" ]; then
            echo "::error::versionCode 不匹配！build.gradle.kts 中为 $VERSION_CODE，但按公式 (MAJOR×10000 + MINOR×100 + PATCH) 计算版本名 $VERSION_NAME 应为 $CALCULATED_VERSION_CODE"
            exit 1
          fi
          echo "✅ versionCode 校验通过: $VERSION_CODE"

      - name: 提取变更记录
        id: changelog
        run: |
          CHANGELOG=""
          if [ -f Product-Spec-CHANGELOG.md ]; then
            CHANGELOG=$(awk "/^## \\[${{ steps.version.outputs.version_name }}\\]/{flag=1;next}/^## \\[/{flag=0}flag" Product-Spec-CHANGELOG.md | sed '/^---$/d;/^### 状态/d;/^### 修改文件/d;/^- `.*$/d;/^$/d;s/^### 变更内容//;s/^### 变更类型//;s/\*\*//g;s/^## //')
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="版本 ${{ steps.version.outputs.version_name }} 更新"
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 解码签名文件
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore

      - name: 构建正式版 APK
        id: build
        env:
          KEYSTORE_FILE: keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease 2>&1 | tee build_output.log
        continue-on-error: true

      - name: 提取构建错误
        if: steps.build.outcome == 'failure'
        id: build_errors
        run: |
          ERRORS=$(grep -E '^(e: |w: |ERROR|FAILURE|> Task.*FAILED)' build_output.log | head -20 || true)
          if [ -z "$ERRORS" ]; then
            ERRORS=$(tail -30 build_output.log)
          fi
          {
            echo "errors<<EOF"
            echo "$ERRORS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 构建失败则终止
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: 重命名 APK 文件
        if: success()
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk \
             2>/dev/null || \
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk

      - name: 创建或更新 Git 标签
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          SHA="${{ github.sha }}"
          gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --method DELETE 2>/dev/null || true
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA"

      - name: 发布到 GitHub Release
        id: release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: DuoSchedule ${{ steps.version.outputs.version_name }}
          body: |
            ## DuoSchedule ${{ steps.version.outputs.version_name }}

            版本号: ${{ steps.version.outputs.version_code }}

            ---

            ${{ steps.changelog.outputs.changelog }}
          files: |
            app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 Gitee Release
        id: gitee_release
        if: success()
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          set +e

          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 发布"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          APK_FILE="app/build/outputs/apk/release/DuoSchedule-${VERSION_NAME}.apk"
          TAG="v${VERSION_NAME}"
          GITEE_API="https://gitee.com/api/v5/repos/su-zijie21/duoschedule"

          echo "检查已存在的 Gitee Release..."
          EXISTING_RELEASE=$(curl -sf "${GITEE_API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" 2>/dev/null || echo "")
          EXISTING_ID=""
          if [ -n "$EXISTING_RELEASE" ]; then
            EXISTING_ID=$(echo "$EXISTING_RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          fi

          if [ -n "$EXISTING_ID" ]; then
            echo "删除已存在的 Gitee Release: $EXISTING_ID"
            curl -sf -X DELETE "${GITEE_API}/releases/${EXISTING_ID}?access_token=${GITEE_TOKEN}" > /dev/null 2>&1 || true
          fi

          echo "创建 Gitee Release..."
          JSON_BODY=$(python3 -c "
          import json, os
          data = {
            'access_token': os.environ['GITEE_TOKEN'],
            'tag_name': 'v' + os.environ['VERSION_NAME'],
            'name': 'DuoSchedule ' + os.environ['VERSION_NAME'],
            'body': '版本号: ' + os.environ['VERSION_CODE'] + '\n\n' + os.environ.get('CHANGELOG', ''),
            'target_commitish': 'main'
          }
          print(json.dumps(data, ensure_ascii=False))
          ")

          RESPONSE=$(curl -s -X POST "${GITEE_API}/releases" \
            -H "Content-Type: application/json" \
            -d "$JSON_BODY")

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")

          if [ -z "$RELEASE_ID" ]; then
            echo "Gitee Release 创建失败"
            echo "$RESPONSE"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "gitee_error<<EOF" >> $GITHUB_OUTPUT
            echo "$RESPONSE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Gitee Release 已创建: $RELEASE_ID"

          echo "上传 APK 到 Gitee Release..."
          UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${GITEE_API}/releases/${RELEASE_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${APK_FILE}")
          UPLOAD_HTTP_CODE=$(echo "$UPLOAD_RESPONSE" | tail -1)
          UPLOAD_BODY=$(echo "$UPLOAD_RESPONSE" | sed '$d')

          if [ "$UPLOAD_HTTP_CODE" = "201" ]; then
            echo "✅ APK 已上传到 Gitee Release"
          else
            echo "⚠️ APK 上传到 Gitee 可能失败 (HTTP $UPLOAD_HTTP_CODE)"
            echo "$UPLOAD_BODY"
            echo "gitee_error<<EOF" >> $GITHUB_OUTPUT
            echo "APK上传失败 (HTTP $UPLOAD_HTTP_CODE): $UPLOAD_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          echo "success=true" >> $GITHUB_OUTPUT

      - name: 更新 update.json
        id: update_repo
        if: success()
        continue-on-error: true
        env:
          UPDATE_REPO_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.changelog }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: su-zijie21
          GITEE_RELEASE_SUCCESS: ${{ steps.gitee_release.outputs.success }}
        run: python3 scripts/update_repo.py

      - name: Server酱通知
        if: always()
        env:
          SERVERCHAN_URL: ${{ secrets.SERVERCHAN_URL }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          GITEE_RELEASE_OUTCOME: ${{ steps.gitee_release.outcome }}
          UPDATE_REPO_OUTCOME: ${{ steps.update_repo.outcome }}
          GITEE_RELEASE_SUCCESS: ${{ steps.gitee_release.outputs.success }}
          BUILD_ERRORS: ${{ steps.build_errors.outputs.errors }}
          GITEE_ERROR: ${{ steps.gitee_release.outputs.gitee_error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SERVERCHAN_URL" ]; then
            echo "SERVERCHAN_URL 未配置，跳过通知"
            exit 0
          fi

          format_status() {
            local outcome="$1"
            case "$outcome" in
              success) echo "✅ 成功" ;;
              failure) echo "❌ 失败" ;;
              skipped) echo "⏭️ 跳过" ;;
              *) echo "❓ $outcome" ;;
            esac
          }

          BUILD_STATUS=$(format_status "$BUILD_OUTCOME")
          RELEASE_STATUS=$(format_status "$RELEASE_OUTCOME")
          GITEE_RELEASE_STATUS=$(format_status "$GITEE_RELEASE_OUTCOME")
          UPDATE_REPO_STATUS=$(format_status "$UPDATE_REPO_OUTCOME")
          export BUILD_STATUS
          export RELEASE_STATUS
          export GITEE_RELEASE_STATUS
          export UPDATE_REPO_STATUS

          if [ "$BUILD_OUTCOME" = "success" ] && [ "$RELEASE_OUTCOME" = "success" ] && [ "$UPDATE_REPO_OUTCOME" = "success" ] && [ "$GITEE_RELEASE_SUCCESS" != "false" ]; then
            export TITLE="✅ DuoSchedule v${VERSION_NAME} 发布成功"
          else
            export TITLE="⚠️ DuoSchedule v${VERSION_NAME} 发布异常"
          fi

          python3 -c "
          import json, os
          version_name = os.environ['VERSION_NAME']
          version_code = os.environ['VERSION_CODE']
          build_status = os.environ['BUILD_STATUS']
          release_status = os.environ['RELEASE_STATUS']
          gitee_release_status = os.environ['GITEE_RELEASE_STATUS']
          update_repo_status = os.environ['UPDATE_REPO_STATUS']
          gitee_release_success = os.environ.get('GITEE_RELEASE_SUCCESS', '')
          build_errors = os.environ.get('BUILD_ERRORS', '')
          gitee_error = os.environ.get('GITEE_ERROR', '')
          run_url = os.environ['RUN_URL']
          title = os.environ['TITLE']
          desp = f'版本: {version_name} ({version_code})  \nAPK 构建: {build_status}  \nGitHub Release: {release_status}  \nGitee Release: {gitee_release_status}  \n更新仓库: {update_repo_status}  '
          if gitee_release_success == 'false':
              desp += f'  \n⚠️ Gitee Release 失败，downloadUrl 已回退到 GitHub  '
          error_parts = []
          if build_errors:
              error_parts.append(f'**构建错误:**  \n```\n{build_errors}\n```')
          if gitee_error:
              error_parts.append(f'**Gitee Release 错误:**  \n```\n{gitee_error}\n```')
          if error_parts:
              desp += f'  \n\n---  \n' + '  \n'.join(error_parts) + '  '
          desp += f' \n\n构建详情: {run_url}'
          data = {
            'title': title,
            'desp': desp
          }
          with open('notify.json', 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False)
          "

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${SERVERCHAN_URL}" \
            -H "Content-Type: application/json" \
            -d @notify.json)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Server酱响应 (HTTP $HTTP_CODE): $BODY"
