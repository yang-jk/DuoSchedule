name: Build & Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore

      - name: Build release APK
        id: build
        env:
          KEYSTORE_FILE: app/keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Extract version info and changelog
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

          CHANGELOG=""
          if [ -f Product-Spec-CHANGELOG.md ]; then
            CHANGELOG=$(awk "/^## \\[${VERSION_NAME}\\]/{flag=1;next}/^## \\[/{flag=0}flag" Product-Spec-CHANGELOG.md | sed '/^---$/d;/^### 状态/d;/^### 修改文件/d;/^- `.*$/d;/^$/d')
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Rename APK
        if: success()
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk \
             2>/dev/null || \
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk

      - name: Create or update tag
        if: success()
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: DuoSchedule ${{ steps.version.outputs.version_name }}
          body: |
            ## DuoSchedule ${{ steps.version.outputs.version_name }}

            版本号: ${{ steps.version.outputs.version_code }}

            ---

            ${{ steps.version.outputs.changelog }}
          files: |
            app/build/outputs/apk/release/DuoSchedule-${{ steps.version.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update update.json
        if: success()
        env:
          UPDATE_REPO_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_NOTES: ${{ steps.version.outputs.changelog }}
        run: |
          REPO_OWNER="yang-jk"
          REPO_NAME="duoschedule-update"
          TAG_NAME="v${VERSION_NAME}"
          DOWNLOAD_URL="https://github.com/${REPO_OWNER}/DuoSchedule/releases/download/${TAG_NAME}/DuoSchedule-${VERSION_NAME}.apk"

          python3 -c "
          import json, sys
          notes = sys.argv[1] if len(sys.argv) > 1 else ''
          data = {
            'latestVersion': '${VERSION_NAME}',
            'latestVersionCode': ${VERSION_CODE},
            'minSupportedVersionCode': 1,
            'downloadUrl': '${DOWNLOAD_URL}',
            'releaseNotes': notes,
            'forceUpdate': False
          }
          with open('update.json', 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
          " "$RELEASE_NOTES"

          git clone https://x-access-token:${UPDATE_REPO_TOKEN}@github.com/${REPO_OWNER}/${REPO_NAME}.git update-repo

          cp update.json update-repo/update.json

          cd update-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update to ${VERSION_NAME} (${VERSION_CODE})" || echo "No changes to commit"
          git push

      - name: Notify via ServerChan
        if: always()
        env:
          SERVERCHAN_URL: ${{ secrets.SERVERCHAN_URL }}
          BUILD_STATUS: ${{ job.status }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CHANGELOG: ${{ steps.version.outputs.changelog }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SERVERCHAN_URL" ]; then
            echo "SERVERCHAN_URL not configured, skipping notification"
            exit 0
          fi

          if [ "$BUILD_STATUS" = "success" ]; then
            TITLE="✅ DuoSchedule v${VERSION_NAME} 构建成功"
            DESP="**版本**: ${VERSION_NAME} (${VERSION_CODE})\n\n**状态**: 构建成功，已发布 Release\n\n[查看构建详情](${RUN_URL})"
          else
            TITLE="❌ DuoSchedule 构建失败"
            DESP="**状态**: 构建失败\n\n[查看构建详情](${RUN_URL})"
          fi

          python3 -c "
          import json, os
          data = {
            'title': os.environ['TITLE'],
            'desp': os.environ['DESP']
          }
          with open('notify.json', 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False)
          "

          curl -s -X POST "${SERVERCHAN_URL}" \
            -H "Content-Type: application/json" \
            -d @notify.json
